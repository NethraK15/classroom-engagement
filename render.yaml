services:
  - type: web
    name: classroom-engagement
    runtime: python
    buildCommand: "pip install --upgrade pip && pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install -r dashboard/requirements.txt"
    startCommand: "python dashboard/app.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
